<script>
    // 1. PASTE YOUR PUBLISHED GOOGLE SHEET CSV LINK HERE:
    const GOOGLE_SHEET_CSV_URL = "PASTE_YOUR_COPIED_CSV_URL_HERE";

    function formatCloudUrl(url) {
      if (!url) return '';
      const driveMatch = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
      if (driveMatch) return `https://drive.google.com/uc?export=download&id=${driveMatch[1]}`;
      if (url.includes('dropbox.com')) return url.replace('dl=0', 'dl=1');
      return url;
    }

    let papersDatabase = [];
    let selectedForm = 'All';
    let selectedExamType = 'All';

    async function loadPapersFromSheet() {
      const container = document.getElementById('papersGrid');
      container.innerHTML = '<div class="col-span-full text-center py-10 text-slate-400 font-semibold text-sm">Loading past papers...</div>';

      try {
        const response = await fetch(GOOGLE_SHEET_CSV_URL);
        const text = await response.text();
        const rows = text.split('\n').filter(r => r.trim() !== '');
        
        // Remove header row
        rows.shift();

        papersDatabase = rows.map(row => {
          // Parse standard CSV columns
          const cols = row.split(',').map(c => c.trim().replace(/^"|"$/g, ''));
          return {
            title: cols[0] || 'Past Paper',
            form: cols[1] || 'Form 4',
            subject: cols[2] || 'General',
            year: cols[3] || '2024',
            exam: cols[4] || 'NECTA',
            paperUrl: formatCloudUrl(cols[5]),
            answersUrl: formatCloudUrl(cols[6])
          };
        });

        filterPapers();
      } catch (err) {
        console.error('Error fetching sheet data:', err);
        container.innerHTML = '<div class="col-span-full text-center py-10 text-rose-500 font-semibold text-sm">Could not load sheet data. Check your published link.</div>';
      }
    }

    function setFormFilter(formName) {
      selectedForm = formName;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.toggle('active-pill', btn.textContent.trim().startsWith(formName));
      });
      filterPapers();
    }

    function setExamType(type) {
      selectedExamType = type;
      document.querySelectorAll('.exam-type-btn').forEach(btn => {
        const isActive = btn.textContent.includes(type) || (type === 'All' && btn.textContent.includes('All'));
        btn.classList.toggle('text-blue-700', isActive);
        btn.classList.toggle('underline', isActive);
        btn.classList.toggle('font-bold', isActive);
        btn.classList.toggle('text-slate-500', !isActive);
      });
      filterPapers();
    }

    function filterPapers() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      const subjectFilter = document.getElementById('subjectFilter').value;

      const filtered = papersDatabase.filter(item => {
        const matchesForm = (selectedForm === 'All') || (item.form.toLowerCase().includes(selectedForm.toLowerCase()));
        const matchesSubject = (subjectFilter === 'All') || (item.subject.toLowerCase() === subjectFilter.toLowerCase());
        const matchesExamType = (selectedExamType === 'All') || (item.exam.toLowerCase() === selectedExamType.toLowerCase());

        const searchCorpus = `${item.title} ${item.subject} ${item.year} ${item.exam} ${item.form}`.toLowerCase();
        const matchesQuery = !query || searchCorpus.includes(query);

        return matchesForm && matchesSubject && matchesExamType && matchesQuery;
      });

      renderCards(filtered);
    }

    function renderCards(list) {
      const container = document.getElementById('papersGrid');
      const emptyState = document.getElementById('noResults');
      const countEl = document.getElementById('paperCount');

      countEl.textContent = `${list.length} papers`;

      if (list.length === 0) {
        container.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');
      container.innerHTML = list.map(item => `
        <div class="paper-card bg-white border border-slate-200/90 rounded-2xl p-4 flex flex-col justify-between shadow-xs">
          <div>
            <div class="flex items-center justify-between text-[11px] font-bold mb-2">
              <span class="bg-blue-50 text-blue-700 px-2.5 py-0.5 rounded-md border border-blue-100">${item.exam}</span>
              <div class="flex items-center gap-1.5">
                ${item.answersUrl ? `<span class="bg-emerald-50 text-emerald-700 px-2 py-0.5 rounded text-[10px] font-bold border border-emerald-100">Answers Available</span>` : ''}
                <span class="text-slate-400 font-semibold">${item.year}</span>
              </div>
            </div>
            <h3 class="font-bold text-slate-800 text-sm sm:text-base leading-snug">${item.title}</h3>
            <p class="text-xs text-slate-500 mt-1.5 flex items-center gap-1.5">
              <span class="font-semibold text-blue-700 bg-blue-50/50 px-2 py-0.5 rounded border border-blue-100">${item.subject}</span>
              <span class="text-slate-300">&bull;</span>
              <span class="font-bold text-slate-700">${item.form}</span>
            </p>
          </div>

          <div class="mt-4 pt-3 border-t border-slate-100 flex flex-col gap-2">
            ${item.paperUrl 
              ? `<a href="${item.paperUrl}" target="_blank" rel="noopener noreferrer" class="w-full inline-flex items-center justify-center gap-1.5 bg-blue-700 hover:bg-blue-800 active:bg-blue-900 text-white text-xs sm:text-sm font-bold py-2.5 px-3 rounded-xl transition shadow-xs">
                  <i data-lucide="file-text" class="w-4 h-4"></i> Download Question Paper
                </a>`
              : `<button class="w-full bg-slate-100 text-slate-400 text-xs py-2 rounded-xl cursor-not-allowed">
                  Paper Coming Soon
                </button>`
            }

            ${item.answersUrl 
              ? `<a href="${item.answersUrl}" target="_blank" rel="noopener noreferrer" class="w-full inline-flex items-center justify-center gap-1.5 bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white text-xs sm:text-sm font-bold py-2 px-3 rounded-xl transition shadow-xs">
                  <i data-lucide="check-circle" class="w-4 h-4"></i> Download Marking Scheme
                </a>`
              : ''
            }
          </div>
        </div>
      `).join('');

      lucide.createIcons();
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadPapersFromSheet();
    });
  </script>
